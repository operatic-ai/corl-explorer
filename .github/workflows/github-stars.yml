name: Refresh GitHub stars
on:
  watch:
    types: [started]
  public:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: github-stars
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'operatic-ai/corl-explorer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read current star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/operatic-ai/corl-explorer | node scripts/update-github-stars.mjs
      - name: Publish changed count
        run: |
          if git diff --quiet -- public/data/github-stars.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/github-stars.json
          git commit -m 'Refresh GitHub star count'
          git pull --rebase origin main
          git push origin HEAD:main
