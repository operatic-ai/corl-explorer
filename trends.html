<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0f0f0" />
    <script>
      // Opening the source file directly needs the local Vite server.
      if (location.protocol === 'file:') {
        location.replace('http://localhost:5173/trends.html' + location.search + location.hash);
      }
      try {
        const choice = localStorage.getItem('corl-theme');
        document.documentElement.dataset.theme = choice === 'dark' || choice === 'light' ? choice : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <meta name="description" content="An independent field guide to robot learning. Explore CoRL papers by task, theme, and year." />
    <title>Paper Trends – CoRL Paper Explorer</title>
    <meta property="og:title" content="CoRL Paper Explorer – 10 Years of Robot Learning" />
    <meta name="twitter:title" content="CoRL Paper Explorer – 10 Years of Robot Learning" />
    <link rel="icon" type="image/svg+xml" href="/brand/actuator.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/trends-page.js"></script>
  </body>
</html>
